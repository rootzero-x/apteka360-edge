; Apteka 360 · Edge-AI — nusxa oling: edge_ai.ini. API/filial/MediaMTX sozlamalari ../edge-agent/edge_agent.ini dan olinadi.
; Har qiymatni A360_AI_<KALIT> muhit o'zgaruvchisi bilan ham berish mumkin.
[ai]
; auto = API dagi barcha (maxfiy bo'lmagan) kameralar, yoki vergul bilan: c1,c2,c3
cameras = auto
; tahlil chastotasi (kadr/s) va oqim (sub = past sifat, tavsiya; main = asosiy)
fps = 3
stream = sub
; yuzni tanish uchun oqim: sub (tejamkor) yoki main (aniqroq, 1 kadr/s; Wi-Fi'da oqimlarni buzishi mumkin — simli LAN'da)
face_stream = sub
; odam aniqlash ishonchi va yuz o'xshashlik chegarasi (kosinus; 0.35 yumshoq … 0.5 qattiq)
person_conf = 0.4
face_match = 0.42
face_every_sec = 2
; davomiylik chegaralari (soniya): hodisa shundan uzoq davom etsa yuboriladi
sitting_min_sec = 60
phone_min_sec = 20
absent_min_sec = 120
out_of_zone_min_sec = 120
queue_min_sec = 45
queue_len = 5
; qisqa uzilishga chidash (s) va uzoq holatni bo'laklash (s)
grace_sec = 8
max_episode_sec = 1800
; kunlik agregatni yuborish vaqti (Toshkent)
daily_send_at = 23:50
; keyframe (past sifat — serverga kam token)
keyframe_width = 480
keyframe_quality = 60
; onnxruntime iplari
threads = 3
; 1 = hodisalarni yubormasdan logga yozish
dry_run = 0
